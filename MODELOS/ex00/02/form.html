<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Email sending form</title>
        <script src="popup.js" defer></script>
    </head>
    <body>
        <h2>Contact Form</h2>
        <form action="">
            <label for="firstname">Firstname:</label>
            <input type="text" id="firstname" name="firstname"></br>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"></br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age"></br>
            <label type="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"></br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"></br>

            <label for="student">Student at 42?:</label>
            <input type="checkbox" id="student" name="student"></br>

            <label for="gender_male">Male</label>
            <input type="radio" id="gender_male" name="gender_male"></br>
            <label for="gender_fame">Fame</label>
            <input type="radio" id="gender_famale" name="gender_famale"></br>
            <label for="gender_other">Other</label>
            <input  type="radio" id="gender_other" name="gender_other"></br>

            <input type="button" value="Run that javascript!" onclick="displayFormContents()">
        </form>
    </body>
</html>
